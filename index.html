/* =========================================
   PREPARAR A VITRINE
========================================= */

const vitrineAntiga = document.querySelector('.listing-placeholder');

if (vitrineAntiga) {

/* =========================================
   FUNÇÕES AUXILIARES
========================================= */

function normalizar(valor) {
  return String(valor ?? '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toLowerCase();
}

function escapar(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

function formatarPreco(valor) {
  const numero = Number(valor);

  if (!Number.isFinite(numero)) {
    return 'Consulte o preço';
  }

  return numero.toLocaleString('pt-BR', {
    style: 'currency',
    currency: 'BRL',
    maximumFractionDigits: 0
  });
}

function obterFoto(imovel) {
  let foto = imovel.foto_principal || '';

  if (typeof foto === 'string' && foto.trim()) {
    try {
      const url = new URL(foto);
      if (url.protocol === 'https:' || url.protocol === 'http:') {
        return url.href;
      }
    } catch (e) {}
  }

  if (imovel.fotos) {
    let fotos = imovel.fotos;

    if (typeof fotos === 'string') {
      try {
        fotos = JSON.parse(fotos);
      } catch (e) {
        fotos = [fotos];
      }
    }

    if (Array.isArray(fotos) && fotos.length) {
      const primeira = fotos[0];
      foto = typeof primeira === 'string'
        ? primeira
        : primeira?.url || primeira?.src || primeira?.path || '';

      try {
        const url = new URL(foto);
        if (url.protocol === 'https:' || url.protocol === 'http:') {
          return url.href;
        }
      } catch (e) {}
    }
  }

  return '';
}

function finalidadeCompativel(valor, filtro) {
  if (!filtro) return true;

  const v = normalizar(valor);
  const f = normalizar(filtro);

  if (f === 'comprar') {
    return ['comprar', 'venda', 'vender'].includes(v);
  }

  if (f === 'alugar') {
    return ['alugar', 'aluguel', 'locacao'].includes(v);
  }

  return v === f;
}

/* =========================================
   MOSTRAR IMÓVEIS
========================================= */

function mostrarImoveis(lista) {
  const grid = document.getElementById('listingGrid');
  const contador = document.getElementById('listingCount');

  if (!grid || !contador) return;

  contador.textContent = lista.length === 1
    ? '1 imóvel encontrado'
    : lista.length + ' imóveis encontrados';

  if (!lista.length) {
    grid.innerHTML = `
      <div class="listing-message">
        <strong>Nenhum imóvel encontrado.</strong>
        Tente modificar os filtros ou entre em contato pelo WhatsApp.
      </div>
    `;
    return;
  }

  grid.innerHTML = lista.map(function(imovel) {
    const foto = obterFoto(imovel);
    const titulo = escapar(imovel.titulo || 'Imóvel disponível');
    const tipo = escapar(imovel.tipo || 'Imóvel');
    const cidade = escapar(imovel.cidade || '');
    const bairro = escapar(imovel.bairro || '');
    const preco = formatarPreco(imovel.preco);
    const quartos = Number(imovel.quartos) || 0;
    const banhos = Number(imovel.banhos) || 0;
    const vagas = Number(imovel.vagas) || 0;
    const area = Number(imovel.area) || 0;
    const finalidade = escapar(imovel.finalidade || '');
    const descricao = escapar(imovel.descricao || imovel.especificacao || '');
    const codigo = escapar(imovel.id);

    const localizacao = [bairro, cidade].filter(Boolean).join(' • ');

    const detalhes = [
      quartos ? quartos + ' quarto(s)' : '',
      banhos ? banhos + ' banheiro(s)' : '',
      vagas ? vagas + ' vaga(s)' : '',
      area ? area + ' m²' : ''
    ].filter(Boolean);

    const mensagem = encodeURIComponent(
      'Olá, Andrew! Tenho interesse no imóvel "' +
      (imovel.titulo || 'Imóvel disponível') +
      '". Código: ' + imovel.id +
      '. Poderia me passar mais informações?'
    );

    return `
      <article class="listing-card">
        ${
          foto
          ? `<img class="listing-photo"
              src="${escapar(foto)}"
              alt="${titulo}"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`
          : ''
        }

        <div class="listing-photo-empty" style="${foto ? 'display:none' : ''}">
          <svg width="46" height="46" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M3 11.5 12 4l9 7.5M5.5 9.8V20h13V9.8M10 20v-5.5h4V20"/>
          </svg>
        </div>

        <div class="listing-info">
          <span class="listing-tag">${tipo}${finalidade ? ' • ' + finalidade : ''}</span>

          <h3 class="listing-title">${titulo}</h3>

          <p class="listing-location">
            ${localizacao || 'Itaúna e região - MG'}
          </p>

          <div class="listing-price">${preco}</div>

          ${
            detalhes.length
            ? `<div class="listing-details">${detalhes.map(escapar).join(' • ')}</div>`
            : ''
          }

          ${
            descricao
            ? `<p class="listing-description">${
                descricao.length > 140
                ? descricao.slice(0, 140) + '...'
                : descricao
              }</p>`
            : ''
          }

          <a class="btn btn-gold"
             href="https://wa.me/5537991198709?text=${mensagem}"
             target="_blank" rel="noopener">
            Tenho interesse
            <svg aria-hidden="true"><use href="#i-arrow"/></svg>
          </a>
        </div>
      </article>
    `;
  }).join('');
}

/* =========================================
   BUSCAR IMÓVEIS NO SUPABASE
========================================= */

async function carregarImoveis() {
  const grid = document.getElementById('listingGrid');

  try {
    const { data, error } = await db
      .from('imoveis')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) throw error;

    todosImoveis = data || [];
    mostrarImoveis(todosImoveis);

  } catch (erro) {
    console.error('Erro ao carregar imóveis:', erro);

    if (grid) {
      grid.innerHTML = `
        <div class="listing-message">
          <strong>Não foi possível carregar os imóveis.</strong>
          Verifique a conexão e as permissões de leitura da tabela no Supabase.
        </div>
      `;
    }

    const contador = document.getElementById('listingCount');
    if (contador) contador.textContent = '';
  }
}

carregarImoveis();

/* =========================================
   FILTROS DE PESQUISA
========================================= */

(function() {
  const form = document.getElementById('searchForm');
  const status = document.getElementById('formStatus');

  function mostrarAviso(mensagem, tipo) {
    status.textContent = mensagem;
    status.className = 'form-status show ' + tipo;
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const cidade = document.getElementById('cidade').value;
    const finalidade = document.getElementById('finalidade').value;
    const tipo = document.getElementById('tipo').value;
    const minimo = document.getElementById('minimo').value;
    const maximo = document.getElementById('maximo').value;

    if (minimo && maximo && Number(minimo) > Number(maximo)) {
      mostrarAviso(
        'O valor mínimo não pode ser maior que o valor máximo.',
        'error'
      );
      document.getElementById('minimo').focus();
      return;
    }

    const filtrados = todosImoveis.filter(function(imovel) {
      const preco = Number(imovel.preco) || 0;

      if (
        cidade &&
        normalizar(imovel.cidade) !== normalizar(cidade)
      ) return false;

      if (
        finalidade &&
        !finalidadeCompativel(imovel.finalidade, finalidade)
      ) return false;

      if (
        tipo &&
        normalizar(imovel.tipo) !== normalizar(tipo)
      ) return false;

      if (minimo && preco < Number(minimo)) return false;
      if (maximo && preco > Number(maximo)) return false;

      return true;
    });

    mostrarImoveis(filtrados);

    mostrarAviso(
      filtrados.length
        ? filtrados.length + ' imóvel(is) encontrado(s). Confira os resultados abaixo.'
        : 'Nenhum imóvel corresponde aos filtros selecionados.',
      'info'
    );

    document.getElementById('imoveis').scrollIntoView({
      behavior: 'smooth'
    });
  });

  form.addEventListener('input', function() {
    if (status.classList.contains('error')) {
      status.className = 'form-status';
    }
  });
})();

/* =========================================
   MENU MOBILE
========================================= */

(function() {
  const toggle = document.querySelector('.menu-toggle');
  const menu = document.getElementById('menu');

  function close() {
    menu.classList.remove('open');
    document.getElementById('topo').classList.remove('menu-open');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', 'Abrir menu');
  }

  toggle.addEventListener('click', function() {
    const open = menu.classList.toggle('open');

    document.getElementById('topo').classList.toggle('menu-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
  });

  menu.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', close);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') close();
  });
})();

/* =========================================
   CABEÇALHO E WHATSAPP FLUTUANTE
========================================= */

(function() {
  const header = document.getElementById('topo');
  const wa = document.getElementById('waFloat');

  function onScroll() {
    const y = window.scrollY;

    header.classList.toggle('scrolled', y > 10);

    const visible = y > 600;
    wa.classList.toggle('show', visible);
    wa.tabIndex = visible ? 0 : -1;
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();

/* =========================================
   ANIMAÇÕES DAS SEÇÕES
========================================= */

(function() {
  const els = document.querySelectorAll('.reveal');

  if (!('IntersectionObserver' in window)) {
    els.forEach(function(el) {
      el.classList.add('in');
    });
    return;
  }

  const io = new IntersectionObserver(function(entries) {
    entries.forEach(function(en) {
      if (en.isIntersecting) {
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, {
    threshold: 0.12,
    rootMargin: '0px 0px -40px 0px'
  });

  els.forEach(function(el) {
    io.observe(el);
  });
})();
</script>
