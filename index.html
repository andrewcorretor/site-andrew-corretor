  function carregarBiblioteca() {
    return new Promise(function (resolve, reject) {
      if (window.supabase && window.supabase.createClient) {
        resolve();
        return;
      }

      const script = document.createElement('script');

      script.src =

  /* =========================================
     FUNÇÕES AUXILIARES
  ========================================= */

  function normalizar(valor) {
    return String(valor ?? '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .trim()
      .toLowerCase();
  }

  function escapar(valor) {
    return String(valor ?? '').replace(/[&<>"']/g, function (c) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c];
    });
  }

  function formatarPreco(valor) {
    if (valor === null || valor === undefined || valor === '') {
      return 'Consulte o preço';
    }

    const numero = Number(valor);

    if (!Number.isFinite(numero)) {
      return 'Consulte o preço';
    }

    return numero.toLocaleString('pt-BR', {
      style: 'currency',
      currency: 'BRL',
      maximumFractionDigits: 0
    });
  }

  function obterFoto(imovel) {
    const foto = imovel.foto_principal;

    if (!foto || typeof foto !== 'string') return '';

    try {
      const url = new URL(foto);

      if (url.protocol === 'https:' || url.protocol === 'http:') {
        return url.href;
      }
    } catch (e) {}

    return '';
  }

  function filtroTodos(valor) {
    const v = normalizar(valor);

    return !v ||
      v === 'todos' ||
      v === 'todas' ||
      v.includes('todas as cidades') ||
      v.includes('todos os tipos') ||
      v.includes('todas as finalidades');
  }

  function finalidadeCompativel(valor, filtro) {
    if (!filtro) return true;

    const v = normalizar(valor);
    const f = normalizar(filtro);

    if (f === 'comprar') {
      return ['comprar', 'venda', 'vender'].includes(v);
    }

    if (f === 'alugar') {
      return ['alugar', 'aluguel', 'locacao'].includes(v);
    }

    return v === f;
  }

  function mensagemWhatsApp(texto) {
    return 'https://wa.me/' + WHATSAPP +
      '?text=' + encodeURIComponent(texto);
  }

  /* =========================================
     BUSCAR IMÓVEIS PUBLICADOS
  ========================================= */

  async function carregarImoveis() {
    const grid = document.getElementById('listingGrid');

    if (!db) {
      mostrarErro(
        'Não foi possível conectar ao banco de dados.'
      );
      return;
    }

    try {
      const resultado = await db
        .from('imoveis')
        .select('*')
        .eq('status', 'ao vivo')
        .order('created_at', { ascending: false });

      if (resultado.error) {
        throw resultado.error;
      }

      todosImoveis = resultado.data || [];

      mostrarImoveis(todosImoveis);

    } catch (erro) {
      console.error('Erro ao carregar imóveis:', erro);

      mostrarErro(
        'Não foi possível carregar os imóveis. Verifique as permissões da tabela no Supabase.'
      );
    }
  }

  function mostrarErro(mensagem) {
    const grid = document.getElementById('listingGrid');
    const contador = document.getElementById('listingCount');

    if (contador) contador.textContent = '';

    if (grid) {
      grid.innerHTML = `
        <div class="listing-message">
          <strong>Não foi possível carregar os imóveis.</strong>
          ${escapar(mensagem)}
        </div>
      `;
    }
  }

  /* =========================================

  ========================================= */

  function prepararFiltros() {
    const form = document.getElementById('searchForm');
    const status = document.getElementById('formStatus');

    if (!form) return;

    function mostrarAviso(mensagem, tipo) {
      if (!status) return;

      status.textContent = mensagem;
      status.className = 'form-status show ' + tipo;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const cidade = document.getElementById('cidade')?.value || '';
      const finalidade = document.getElementById('finalidade')?.value || '';
      const tipo = document.getElementById('tipo')?.value || '';

      const minimo = document.getElementById('minimo')?.value || '';
      const maximo = document.getElementById('maximo')?.value || '';

      if (
        minimo &&
        maximo &&
        Number(minimo) > Number(maximo)
      ) {
        mostrarAviso(
          'O valor mínimo não pode ser maior que o valor máximo.',
          'error'
        );

        document.getElementById('minimo')?.focus();

        return;
      }

      const filtrados = todosImoveis.filter(function (imovel) {
        const preco = Number(imovel.preco) || 0;

        if (
          !filtroTodos(cidade) &&
          normalizar(imovel.cidade) !== normalizar(cidade)
        ) return false;

        if (
          !filtroTodos(finalidade) &&
          !finalidadeCompativel(imovel.finalidade, finalidade)
        ) return false;

        if (
          !filtroTodos(tipo) &&
          normalizar(imovel.tipo) !== normalizar(tipo)
        ) return false;

        if (minimo && preco < Number(minimo)) return false;

        if (maximo && preco > Number(maximo)) return false;

        return true;
      });

      mostrarImoveis(filtrados);

      mostrarAviso(
        filtrados.length
          ? filtrados.length + ' imóvel(is) encontrado(s). Confira os resultados abaixo.'
          : 'Nenhum imóvel corresponde aos filtros selecionados.',
        'info'
      );

      const secao = document.getElementById('imoveis');

      if (secao) {
        secao.scrollIntoView({ behavior: 'smooth' });
      }
    });

    form.addEventListener('input', function () {
      if (status && status.classList.contains('error')) {
        status.className = 'form-status';
      }
    });
  }

  /* =========================================

  ========================================= */

  function prepararMenu() {
    const toggle = document.querySelector('.menu-toggle');
    const menu = document.getElementById('menu');
    const topo = document.getElementById('topo');

    if (!toggle || !menu) return;

    function fechar() {
      menu.classList.remove('open');

      if (topo) {
        topo.classList.remove('menu-open');
      }

      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Abrir menu');
    }

    toggle.addEventListener('click', function () {
      const aberto = menu.classList.toggle('open');

      if (topo) {
        topo.classList.toggle('menu-open', aberto);
      }

      toggle.setAttribute(
        'aria-expanded',
        aberto ? 'true' : 'false'
      );

      toggle.setAttribute(
        'aria-label',
        aberto ? 'Fechar menu' : 'Abrir menu'
      );
    });

    menu.querySelectorAll('a').forEach(function (link) {
      link.addEventListener('click', fechar);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') fechar();
    });
  }

  /* =========================================

  ========================================= */

  function prepararCabecalho() {
    const header = document.getElementById('topo');
    const whatsapp = document.getElementById('waFloat');

    function aoRolar() {
      const y = window.scrollY;

      if (header) {
        header.classList.toggle('scrolled', y > 10);
      }

      if (whatsapp) {
        const visivel = y > 600;

        whatsapp.classList.toggle('show', visivel);

        whatsapp.tabIndex = visivel ? 0 : -1;
      }
    }

    window.addEventListener('scroll', aoRolar, {
      passive: true
    });

    aoRolar();
  }

  /* =========================================
     ANIMAÇÕES
  ========================================= */

  function prepararAnimacoes() {
    const elementos = document.querySelectorAll('.reveal');

    if (!('IntersectionObserver' in window)) {
      elementos.forEach(function (el) {
        el.classList.add('in');
      });

      return;
    }

    const observador = new IntersectionObserver(
      function (entradas) {
        entradas.forEach(function (entrada) {
          if (entrada.isIntersecting) {
            entrada.target.classList.add('in');

            observador.unobserve(entrada.target);
          }
        });
      },
      {
        threshold: 0.12,
        rootMargin: '0px 0px -40px 0px'
      }
    );

    elementos.forEach(function (el) {
      observador.observe(el);
    });
  }

      console.error('Falha na inicialização:', erro);

      mostrarErro(
        'Verifique sua conexão com a internet e tente novamente.'
      );
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciar);
  } else {
    iniciar();
  }

})();
</script>
