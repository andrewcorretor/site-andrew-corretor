
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Admin | Andrew Corretor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f2f2f2;
  color:#222;
  font-family:Arial,sans-serif;
}

header{
  background:#111;
  color:white;
  padding:25px;
  text-align:center;
}

header h1{margin:0}
header p{color:#d5b45b}

main{
  max-width:950px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:white;
  padding:24px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 10px #0001;
}

h2{margin-top:0}

label{
  display:block;
  margin:13px 0 6px;
  font-weight:bold;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:15px;
}

input[type="file"]{
  background:#fafafa;
  cursor:pointer;
}

textarea{min-height:100px}

button{
  padding:12px 18px;
  border:0;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin:8px 5px 0 0;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{background:#111;color:white}
.gold{background:#c4a04b;color:#111}
.danger{background:#b3261e;color:white}

.property{
  border:1px solid #ddd;
  padding:16px;
  margin-top:15px;
  border-radius:8px;
}

.property img{
  width:100%;
  max-height:260px;
  object-fit:cover;
  border-radius:6px;
  margin-top:10px;
}

.hidden{display:none}

.message{
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  background:#eee;
  overflow-wrap:anywhere;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.photo-info{
  font-size:13px;
  color:#666;
  margin-top:8px;
}

@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .card{padding:17px}
}
</style>
</head>

<body>

<header>
  <h1>Andrew Corretor</h1>
  <p>Painel Administrativo</p>
</header>

<main>

<section class="card" id="loginBox">
  <h2>Acesso administrativo</h2>

  <label>E-mail</label>
  <input type="email" id="email" placeholder="Seu e-mail">

  <label>Senha</label>
  <input type="password" id="password" placeholder="Sua senha">

  <button class="primary" id="loginBtn">Entrar</button>

  <div id="loginMessage" class="message hidden"></div>
</section>

<section id="dashboard" class="hidden">

  <div class="card">
    <h2>Gerenciar imóveis</h2>
    <p id="userInfo"></p>
    <button class="danger" id="logoutBtn">Sair do painel</button>
  </div>

  <div class="card">

    <h2 id="formTitle">Cadastrar novo imóvel</h2>

    <form id="propertyForm">

      <input type="hidden" id="propertyId">

      <label>Título do imóvel</label>
      <input id="titulo" required placeholder="Ex.: Casa no bairro Santa Edwiges">

      <div class="grid">

        <div>
          <label>Tipo de imóvel</label>
          <select id="tipo">
            <option>Casa</option>
            <option>Apartamento</option>
            <option>Sítio</option>
            <option>Fazenda</option>
            <option>Chácara</option>
            <option>Lote</option>
            <option>Terreno</option>
          </select>
        </div>

        <div>
          <label>Finalidade</label>
          <select id="finalidade">
            <option value="Venda">Venda</option>
            <option value="Aluguel">Aluguel</option>
          </select>
        </div>

      </div>

      <div class="grid">

        <div>
          <label>Cidade</label>
          <input id="cidade" required placeholder="Ex.: Itaúna">
        </div>

        <div>
          <label>Bairro ou região</label>
          <input id="bairro" placeholder="Ex.: Santa Edwiges">
        </div>

      </div>

      <label>Preço (R$)</label>
      <input id="preco" type="number" min="0" step="0.01" required>

      <label>Descrição</label>
      <textarea id="descricao" placeholder="Descreva o imóvel"></textarea>

      <div class="grid">

        <div>
          <label>Quartos</label>
          <input id="quartos" type="number" min="0" value="0">
        </div>

        <div>
          <label>Banheiros</label>
          <input id="banheiros" type="number" min="0" value="0">
        </div>

      </div>

      <div class="grid">

        <div>
          <label>Vagas de garagem</label>
          <input id="vagas" type="number" min="0" value="0">
        </div>

        <div>
          <label>Área (m²)</label>
          <input id="area" type="number" min="0" step="0.01">
        </div>

      </div>

      <label>Foto principal do imóvel</label>
      <input id="foto_principal" type="file" accept="image/*">

      <p class="photo-info" id="photoInfo">
        Selecione uma imagem do seu computador. Máximo de 10 MB.
      </p>

      <label>Status do imóvel</label>
      <select id="status">
        <option>Disponível</option>
        <option>Reservado</option>
        <option>Vendido</option>
      </select>

      <button type="submit" class="primary" id="saveBtn">
        Cadastrar imóvel
      </button>

      <button type="button" class="gold hidden" id="cancelBtn">
        Cancelar edição
      </button>

    </form>

    <div id="formMessage" class="message hidden"></div>

  </div>

  <div class="card">
    <h2>Imóveis cadastrados</h2>
    <div id="propertyList">Carregando imóveis...</div>
  </div>

</section>

</main>

<script>

// ====================================
// CONEXÃO SUPABASE
// ====================================

const SUPABASE_URL = "https://gvcqmrkievpxqshfmfaj.supabase.co";

const SUPABASE_KEY = "sb_publishable_E-rC-JV_EJRjHH1V_guhAA_kZ7dxfMo";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

// Guarda a URL da foto atual durante uma edição.
let fotoAtualUrl = null;


// ====================================
// MENSAGENS
// ====================================

function showMessage(id, text) {
  $(id).textContent = text;
  $(id).classList.remove("hidden");
}

function hideMessage(id) {
  $(id).classList.add("hidden");
}

function money(value) {
  return Number(value || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}


// ====================================
// STORAGE - FOTOS DOS IMÓVEIS
// ====================================

async function uploadPhoto(file) {

  if (!file.type.startsWith("image/")) {
    throw new Error("Selecione um arquivo de imagem.");
  }

  if (file.size > 10 * 1024 * 1024) {
    throw new Error("A imagem deve ter no máximo 10 MB.");
  }

  const extensaoOriginal = file.name.split(".").pop();

  const extensao = extensaoOriginal
    .toLowerCase()
    .replace(/[^a-z0-9]/g, "") || "jpg";

  const caminhoFoto =
    Date.now() + "-" +
    Math.random().toString(36).slice(2) +
    "." + extensao;

  const { error } = await db.storage
    .from("imoveis")
    .upload(caminhoFoto, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) {
    throw error;
  }

  const { data } = db.storage
    .from("imoveis")
    .getPublicUrl(caminhoFoto);

  return {
    url: data.publicUrl,
    path: caminhoFoto
  };
}


// Recupera o caminho da imagem a partir da URL pública.

function getPhotoPath(url) {

  if (!url) return null;

  const marker =
    "/storage/v1/object/public/imoveis/";

  const position = url.indexOf(marker);

  if (position === -1) return null;

  const path = url
    .slice(position + marker.length)
    .split("?")[0];

  try {
    return decodeURIComponent(path);
  } catch {
    return path;
  }
}


// Exclui uma foto do Storage.

async function removePhoto(url) {

  const path = getPhotoPath(url);

  if (!path) return;

  const { error } = await db.storage
    .from("imoveis")
    .remove([path]);

  if (error) {
    throw error;
  }
}


// ====================================
// LOGIN E PAINEL
// ====================================

function showLogin() {
  $("loginBox").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
}

async function showDashboard(user) {

  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");

  $("userInfo").textContent =
    "Conectado: " + user.email;

  await loadProperties();
}

async function checkSession() {

  const { data, error } = await db.auth.getSession();

  if (error) {
    showMessage("loginMessage", error.message);
    return;
  }

  if (data.session) {
    await showDashboard(data.session.user);
  } else {
    showLogin();
  }
}


// ====================================
// ENTRAR
// ====================================

$("loginBtn").addEventListener("click", async () => {

  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    showMessage(
      "loginMessage",
      "Preencha e-mail e senha."
    );
    return;
  }

  $("loginBtn").disabled = true;

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  $("loginBtn").disabled = false;

  if (error) {
    showMessage(
      "loginMessage",
      "Erro no acesso: " + error.message
    );
    return;
  }

  hideMessage("loginMessage");

  await showDashboard(data.user);

});


// ====================================
// SAIR
// ====================================

$("logoutBtn").addEventListener("click", async () => {

  const { error } = await db.auth.signOut();

  if (error) {
    alert("Erro ao sair: " + error.message);
    return;
  }

  showLogin();

});


// ====================================
// CADASTRAR E EDITAR IMÓVEIS
// ====================================

$("propertyForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const id = $("propertyId").value;
    const arquivo = $("foto_principal").files[0];

    const fotoAntiga = fotoAtualUrl;

    let novaFoto = null;

    $("saveBtn").disabled = true;

    $("saveBtn").textContent = "Salvando...";

    hideMessage("formMessage");

    try {

      // Envia a foto primeiro, se uma nova foi selecionada.

      if (arquivo) {
        novaFoto = await uploadPhoto(arquivo);
      }

      // Monta os dados do imóvel.

      const property = {

        titulo: $("titulo").value.trim(),

        tipo: $("tipo").value,

        finalidade: $("finalidade").value,

        cidade: $("cidade").value.trim(),

        bairro: $("bairro").value.trim(),

        preco: Number($("preco").value),

        descricao: $("descricao").value.trim(),

        quartos: Number($("quartos").value || 0),

        banheiros: Number($("banheiros").value || 0),

        vagas: Number($("vagas").value || 0),

        area: $("area").value
          ? Number($("area").value)
          : null,

        foto_principal: novaFoto
          ? novaFoto.url
          : fotoAntiga,

        status: $("status").value

      };


      // Salva no Supabase.

      const result = id

        ? await db
            .from("imoveis")
            .update(property)
            .eq("id", id)

        : await db
            .from("imoveis")
            .insert([property]);


      if (result.error) {

        // Se o banco falhar, tenta remover a foto
        // que acabou de ser enviada.

        if (novaFoto) {
          try {
            await removePhoto(novaFoto.url);
          } catch (cleanupError) {
            console.error(cleanupError);
          }
        }

        throw result.error;

      }


      // Se a edição recebeu uma nova foto,
      // tenta excluir a foto antiga.

      let avisoFoto = "";

      if (id && novaFoto && fotoAntiga) {

        try {
          await removePhoto(fotoAntiga);
        } catch (cleanupError) {
          console.error(cleanupError);

          avisoFoto =
            " A foto anterior não pôde ser excluída do Storage.";
        }

      }


      showMessage(
        "formMessage",
        (id
          ? "Imóvel atualizado com sucesso!"
          : "Imóvel cadastrado com sucesso!") +
        avisoFoto
      );

      resetForm();

      await loadProperties();

    } catch (error) {

      showMessage(
        "formMessage",
        "Erro ao salvar imóvel: " +
        (error.message || "Erro desconhecido.")
      );

    } finally {

      $("saveBtn").disabled = false;

      $("saveBtn").textContent =
        $("propertyId").value
          ? "Salvar alterações"
          : "Cadastrar imóvel";

    }

  }
);


// ====================================
// LISTAR IMÓVEIS
// ====================================

async function loadProperties() {

  $("propertyList").textContent =
    "Carregando imóveis...";

  const { data, error } = await db
    .from("imoveis")
    .select("*")
    .order("id", { ascending: false });

  if (error) {

    $("propertyList").textContent =
      "Erro ao carregar: " + error.message;

    return;
  }

  $("propertyList").replaceChildren();

  if (!data.length) {

    $("propertyList").textContent =
      "Nenhum imóvel cadastrado.";

    return;
  }

  data.forEach(p => {

    const card = document.createElement("div");

    card.className = "property";

    const title = document.createElement("h3");

    title.textContent =
      p.titulo || "Imóvel sem título";

    const details = document.createElement("p");

    details.textContent =
      [p.cidade, p.bairro].filter(Boolean).join(" - ") +
      " | " + money(p.preco);

    const info = document.createElement("p");

    info.textContent =
      p.tipo + " | " +
      p.finalidade + " | Status: " +
      p.status;

    const description = document.createElement("p");

    description.textContent =
      p.descricao || "";

    card.append(
      title,
      details,
      info,
      description
    );


    // Mostra a foto principal.

    if (p.foto_principal) {

      const img = document.createElement("img");

      img.src = p.foto_principal;

      img.alt = p.titulo || "Foto do imóvel";

      img.onerror = () => img.remove();

      card.appendChild(img);

    }


    // Botão editar.

    const edit = document.createElement("button");

    edit.className = "gold";

    edit.textContent = "Editar";

    edit.onclick = () => editProperty(p);


    // Botão excluir.

    const remove = document.createElement("button");

    remove.className = "danger";

    remove.textContent = "Excluir";

    remove.onclick = () => deleteProperty(p);


    card.append(edit, remove);

    $("propertyList").appendChild(card);

  });

}


// ====================================
// EDITAR IMÓVEL
// ====================================

function editProperty(p) {

  $("propertyId").value = p.id;

  $("titulo").value = p.titulo || "";

  $("tipo").value = p.tipo || "Casa";

  $("finalidade").value = p.finalidade || "Venda";

  $("cidade").value = p.cidade || "";

  $("bairro").value = p.bairro || "";

  $("preco").value = p.preco || "";

  $("descricao").value = p.descricao || "";

  $("quartos").value = p.quartos || 0;

  $("banheiros").value = p.banheiros || 0;

  $("vagas").value = p.vagas || 0;

  $("area").value = p.area || "";


  // Guarda a foto existente.
  // O campo file não deve receber uma URL.

  fotoAtualUrl = p.foto_principal || null;

  $("foto_principal").value = "";

  $("photoInfo").textContent = fotoAtualUrl
    ? "Este imóvel já possui uma foto. Selecione outra somente se quiser substituí-la."
    : "Este imóvel ainda não possui foto principal.";


  $("status").value = p.status || "Disponível";

  $("formTitle").textContent = "Editar imóvel";

  $("saveBtn").textContent = "Salvar alterações";

  $("cancelBtn").classList.remove("hidden");

  hideMessage("formMessage");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// ====================================
// EXCLUIR IMÓVEL
// ====================================

async function deleteProperty(p) {

  const confirmar = confirm(
    "Tem certeza que deseja excluir este imóvel?"
  );

  if (!confirmar) return;

  const { error } = await db
    .from("imoveis")
    .delete()
    .eq("id", p.id);

  if (error) {

    alert("Erro ao excluir imóvel: " + error.message);

    return;
  }


  // Depois de excluir o registro,
  // tenta remover sua foto do Storage.

  let mensagem =
    "Imóvel excluído com sucesso!";

  if (p.foto_principal) {

    try {

      await removePhoto(p.foto_principal);

    } catch (errorFoto) {

      console.error(errorFoto);

      mensagem +=
        "\nAtenção: não foi possível excluir a foto do armazenamento.";

    }

  }

  alert(mensagem);

  await loadProperties();

}


// ====================================
// LIMPAR FORMULÁRIO
// ====================================

function resetForm() {

  $("propertyForm").reset();

  $("propertyId").value = "";

  fotoAtualUrl = null;

  $("photoInfo").textContent =
    "Selecione uma imagem do seu computador. Máximo de 10 MB.";

  $("formTitle").textContent =
    "Cadastrar novo imóvel";

  $("saveBtn").textContent =
    "Cadastrar imóvel";

  $("cancelBtn").classList.add("hidden");

}


// ====================================
// CANCELAR EDIÇÃO
// ====================================

$("cancelBtn").addEventListener(
  "click",
  () => {
    resetForm();
    hideMessage("formMessage");
  }
);


// ====================================
// ALTERAÇÃO DE SESSÃO
// ====================================

db.auth.onAuthStateChange(event => {

  if (event === "SIGNED_OUT") {
    showLogin();
  }

});


// ====================================
// INICIAR PAINEL
// ====================================

checkSession();

</script>

</body>
</html>
