
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Admin | Andrew Corretor</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#222;font-family:Arial,sans-serif}
header{background:#111;color:white;padding:25px;text-align:center}
header h1{margin:0}
header p{color:#d5b45b}
main{max-width:950px;margin:30px auto;padding:15px}
.card{background:white;padding:24px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 10px #0001}
h2{margin-top:0}
label{display:block;margin:13px 0 6px;font-weight:bold}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:15px}
input[type=file]{background:#fafafa;cursor:pointer}
textarea{min-height:100px}
button{padding:12px 18px;border:0;border-radius:6px;cursor:pointer;font-weight:bold;margin:8px 5px 0 0}
button:disabled{opacity:.6;cursor:not-allowed}
.primary{background:#111;color:white}
.gold{background:#c4a04b;color:#111}
.danger{background:#b3261e;color:white}
.property{border:1px solid #ddd;padding:16px;margin-top:15px;border-radius:8px}
.property img{width:100%;max-height:260px;object-fit:cover;border-radius:6px;margin-top:10px}
.hidden{display:none!important}
.message{padding:12px;margin:10px 0;border-radius:6px;background:#eee;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-info{font-size:13px;color:#666;margin-top:8px}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:15px}
.photo-item{border:1px solid #ddd;padding:8px;border-radius:8px;min-width:0}
.photo-item img{width:100%;height:105px;object-fit:cover;border-radius:5px}
.photo-item label{font-size:12px;margin:7px 0;display:flex;align-items:center;gap:5px}
.photo-item input{width:auto}
.photo-item span{font-size:11px;overflow-wrap:anywhere}
.status{font-weight:bold;color:#66501d}
@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:17px}}
</style>
</head>

<body>

<header>
<h1>Andrew Corretor</h1>
<p>Painel Administrativo</p>
</header>

<main>

<section class="card" id="loginBox">
<h2>Acesso administrativo</h2>

<label>E-mail</label>
<input type="email" id="email" placeholder="Seu e-mail">

<label>Senha</label>
<input type="password" id="password" placeholder="Sua senha">

<button class="primary" id="loginBtn">Entrar</button>
<div id="loginMessage" class="message hidden"></div>
</section>

<section id="dashboard" class="hidden">

<div class="card">
<h2>Gerenciar imóveis</h2>
<p id="userInfo"></p>
<button class="danger" id="logoutBtn">Sair do painel</button>
</div>

<div class="card">

<h2 id="formTitle">Cadastrar novo imóvel</h2>

<form id="propertyForm">

<input type="hidden" id="propertyId">

<label>Título do imóvel</label>
<input id="titulo" required placeholder="Ex.: Casa no bairro Santa Edwiges">

<div class="grid">
<div>
<label>Tipo de imóvel</label>
<select id="tipo">
<option>Casa</option>
<option>Apartamento</option>
<option>Sítio</option>
<option>Fazenda</option>
<option>Chácara</option>
<option>Lote</option>
<option>Terreno</option>
</select>
</div>

<div>
<label>Finalidade</label>
<select id="finalidade">
<option value="Venda">Venda</option>
<option value="Aluguel">Aluguel</option>
</select>
</div>
</div>

<div class="grid">
<div>
<label>Cidade</label>
<input id="cidade" required placeholder="Ex.: Itaúna">
</div>
<div>
<label>Bairro ou região</label>
<input id="bairro" placeholder="Ex.: Santa Edwiges">
</div>
</div>

<label>Preço (R$)</label>
<input id="preco" type="number" min="0" step="0.01" required>

<label>Descrição</label>
<textarea id="descricao" placeholder="Descreva o imóvel"></textarea>

<div class="grid">
<div>
<label>Quartos</label>
<input id="quartos" type="number" min="0" value="0">
</div>
<div>
<label>Banheiros</label>
<input id="banheiros" type="number" min="0" value="0">
</div>
</div>

<div class="grid">
<div>
<label>Vagas de garagem</label>
<input id="vagas" type="number" min="0" value="0">
</div>
<div>
<label>Área (m²)</label>
<input id="area" type="number" min="0" step="0.01">
</div>
</div>

<label>Fotos do imóvel</label>
<input id="fotos" type="file" accept="image/*" multiple>

<p class="photo-info">
Selecione várias imagens do computador. Máximo de 10 MB por imagem.
Escolha abaixo qual será a foto principal.
</p>

<div id="photoPreview" class="photo-grid"></div>

<label>Status do imóvel</label>
<select id="status">
<option>Disponível</option>
<option>Reservado</option>
<option>Vendido</option>
</select>

<button type="submit" class="primary" id="saveBtn">
Cadastrar imóvel
</button>

<button type="button" class="gold hidden" id="cancelBtn">
Cancelar edição
</button>

</form>

<div id="formMessage" class="message hidden"></div>
</div>

<div class="card">
<h2>Imóveis cadastrados</h2>
<div id="propertyList">Carregando imóveis...</div>
</div>

</section>
</main>

<script>

// ========================================
// CONEXÃO SUPABASE
// ========================================

const SUPABASE_URL = "https://gvcqmrkievpxqshfmfaj.supabase.co";
const SUPABASE_KEY = "sb_publishable_E-rC-JV_EJRjHH1V_guhAA_kZ7dxfMo";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

const BUCKET = "imoveis";
const MAX_FILE_SIZE = 10 * 1024 * 1024;

let currentPhotos = [];
let selectedMain = null;
let temporaryUrls = [];


// ========================================
// MENSAGENS
// ========================================

function showMessage(id, message) {
  $(id).textContent = message;
  $(id).classList.remove("hidden");
}

function hideMessage(id) {
  $(id).classList.add("hidden");
}

function money(value) {
  return Number(value || 0).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}


// ========================================
// FOTOS
// ========================================

function normalizePhotos(value) {
  if (!value) return [];

  let list = value;

  if (typeof list === "string") {
    try {
      list = JSON.parse(list);
    } catch {
      return list.startsWith("http") ? [list] : [];
    }
  }

  if (!Array.isArray(list)) return [];

  return list
    .map(item => {
      if (typeof item === "string") return item;
      if (item && typeof item.url === "string") return item.url;
      return null;
    })
    .filter(Boolean);
}

function uniquePhotos(list) {
  return [...new Set(list.filter(Boolean))];
}

function clearTemporaryUrls() {
  temporaryUrls.forEach(url => URL.revokeObjectURL(url));
  temporaryUrls = [];
}

function renderPhotoPreview() {
  clearTemporaryUrls();

  const container = $("photoPreview");
  container.replaceChildren();

  const files = Array.from($("fotos").files || []);

  const items = [];

  currentPhotos.forEach((url, index) => {
    items.push({
      key: "old:" + index,
      url,
      label: "Foto já armazenada"
    });
  });

  files.forEach((file, index) => {
    const url = URL.createObjectURL(file);
    temporaryUrls.push(url);

    items.push({
      key: "new:" + index,
      url,
      label: file.name
    });
  });

  if (!items.length) {
    container.textContent = "Nenhuma foto selecionada.";
    return;
  }

  items.forEach(item => {
    const box = document.createElement("div");
    box.className = "photo-item";

    const img = document.createElement("img");
    img.src = item.url;
    img.alt = "Foto do imóvel";

    const label = document.createElement("label");

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "mainPhoto";
    radio.value = item.key;
    radio.checked = selectedMain === item.key;

    radio.addEventListener("change", () => {
      selectedMain = item.key;
    });

    const text = document.createElement("span");
    text.textContent = "Foto principal";

    label.append(radio, text);

    const filename = document.createElement("span");
    filename.textContent = item.label;

    box.append(img, label, filename);
    container.appendChild(box);
  });
}

$("fotos").addEventListener("change", () => {
  const files = Array.from($("fotos").files || []);

  for (const file of files) {
    if (!file.type.startsWith("image/")) {
      showMessage("formMessage", "Um dos arquivos não é uma imagem.");
      $("fotos").value = "";
      renderPhotoPreview();
      return;
    }

    if (file.size > MAX_FILE_SIZE) {
      showMessage(
        "formMessage",
        "A imagem " + file.name + " ultrapassa o limite de 10 MB."
      );
      $("fotos").value = "";
      renderPhotoPreview();
      return;
    }
  }

  hideMessage("formMessage");

  if (!selectedMain && !currentPhotos.length && files.length) {
    selectedMain = "new:0";
  }

  renderPhotoPreview();
});

async function uploadPhoto(file) {
  if (!file.type.startsWith("image/")) {
    throw new Error("Selecione somente imagens.");
  }

  if (file.size > MAX_FILE_SIZE) {
    throw new Error("Cada imagem pode ter no máximo 10 MB.");
  }

  const extension = (
    file.name.split(".").pop() || "jpg"
  ).toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";

  const filename =
    Date.now() + "-" +
    Math.random().toString(36).slice(2) +
    "." + extension;

  const { error } = await db.storage
    .from(BUCKET)
    .upload(filename, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data } = db.storage
    .from(BUCKET)
    .getPublicUrl(filename);

  return data.publicUrl;
}

function getPhotoPath(url) {
  if (!url) return null;

  const marker = "/storage/v1/object/public/" + BUCKET + "/";
  const position = url.indexOf(marker);

  if (position === -1) return null;

  let path = url.slice(position + marker.length).split("?")[0];

  try {
    path = decodeURIComponent(path);
  } catch {}

  return path;
}

async function removePhoto(url) {
  const path = getPhotoPath(url);
  if (!path) return;

  const { error } = await db.storage
    .from(BUCKET)
    .remove([path]);

  if (error) throw error;
}

async function removePhotos(urls) {
  const paths = uniquePhotos(urls)
    .map(getPhotoPath)
    .filter(Boolean);

  if (!paths.length) return;

  const { error } = await db.storage
    .from(BUCKET)
    .remove(paths);

  if (error) throw error;
}


// ========================================
// LOGIN
// ========================================

function showLogin() {
  $("loginBox").classList.remove("hidden");
  $("dashboard").classList.add("hidden");
}

async function showDashboard(user) {
  $("loginBox").classList.add("hidden");
  $("dashboard").classList.remove("hidden");

  $("userInfo").textContent = "Conectado: " + user.email;

  await loadProperties();
}

async function checkSession() {
  const { data, error } = await db.auth.getSession();

  if (error) {
    showMessage("loginMessage", error.message);
    return;
  }

  if (data.session) {
    await showDashboard(data.session.user);
  } else {
    showLogin();
  }
}

$("loginBtn").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    showMessage("loginMessage", "Preencha e-mail e senha.");
    return;
  }

  $("loginBtn").disabled = true;

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  $("loginBtn").disabled = false;

  if (error) {
    showMessage("loginMessage", "Erro no acesso: " + error.message);
    return;
  }

  hideMessage("loginMessage");
  await showDashboard(data.user);
});

$("logoutBtn").addEventListener("click", async () => {
  const { error } = await db.auth.signOut();

  if (error) {
    alert("Erro ao sair: " + error.message);
    return;
  }

  showLogin();
});


// ========================================
// CADASTRAR E EDITAR
// ========================================

$("propertyForm").addEventListener("submit", async event => {
  event.preventDefault();

  const id = $("propertyId").value;
  const files = Array.from($("fotos").files || []);

  const uploadedPhotos = [];

  $("saveBtn").disabled = true;
  $("saveBtn").textContent = "Salvando...";

  hideMessage("formMessage");

  try {
    // Enviar todas as novas fotos.

    for (const file of files) {
      const url = await uploadPhoto(file);
      uploadedPhotos.push(url);
    }

    const allPhotos = uniquePhotos([
      ...currentPhotos,
      ...uploadedPhotos
    ]);

    // Determinar foto principal.

    let mainPhoto = null;

    if (selectedMain && selectedMain.startsWith("old:")) {
      const index = Number(selectedMain.split(":")[1]);
      mainPhoto = currentPhotos[index] || null;
    }

    if (selectedMain && selectedMain.startsWith("new:")) {
      const index = Number(selectedMain.split(":")[1]);
      mainPhoto = uploadedPhotos[index] || null;
    }

    if (!mainPhoto) {
      mainPhoto = currentPhotos[0] || uploadedPhotos[0] || null;
    }

    // Preparar os dados do imóvel.

    const property = {
      titulo: $("titulo").value.trim(),
      tipo: $("tipo").value,
      finalidade: $("finalidade").value,
      cidade: $("cidade").value.trim(),
      bairro: $("bairro").value.trim(),
      preco: Number($("preco").value),
      descricao: $("descricao").value.trim(),
      quartos: Number($("quartos").value || 0),
      banheiros: Number($("banheiros").value || 0),
      vagas: Number($("vagas").value || 0),
      area: $("area").value ? Number($("area").value) : null,
      foto_principal: mainPhoto,
      fotos: allPhotos,
      status: $("status").value
    };

    // Salvar no banco.

    const result = id
      ? await db.from("imoveis").update(property).eq("id", id)
      : await db.from("imoveis").insert([property]);

    if (result.error) throw result.error;

    showMessage(
      "formMessage",
      id
        ? "Imóvel atualizado com sucesso!"
        : "Imóvel cadastrado com sucesso!"
    );

    resetForm();
    await loadProperties();

  } catch (error) {
    // Limpar somente os arquivos novos desta tentativa.

    try {
      await removePhotos(uploadedPhotos);
    } catch (cleanupError) {
      console.error("Erro ao limpar fotos:", cleanupError);
    }

    showMessage(
      "formMessage",
      "Erro ao salvar imóvel: " + (error.message || "Erro desconhecido.")
    );

  } finally {
    $("saveBtn").disabled = false;

    $("saveBtn").textContent =
      $("propertyId").value
        ? "Salvar alterações"
        : "Cadastrar imóvel";
  }
});


// ========================================
// LISTAR IMÓVEIS
// ========================================

async function loadProperties() {
  $("propertyList").textContent = "Carregando imóveis...";

  const { data, error } = await db
    .from("imoveis")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    $("propertyList").textContent = "Erro ao carregar: " + error.message;
    return;
  }

  $("propertyList").replaceChildren();

  if (!data || !data.length) {
    $("propertyList").textContent = "Nenhum imóvel cadastrado.";
    return;
  }

  data.forEach(p => {
    const card = document.createElement("div");
    card.className = "property";

    const title = document.createElement("h3");
    title.textContent = p.titulo || "Imóvel sem título";

    const details = document.createElement("p");
    details.textContent =
      [p.cidade, p.bairro].filter(Boolean).join(" - ") +
      " | " + money(p.preco);

    const info = document.createElement("p");
    info.textContent =
      (p.tipo || "") + " | " +
      (p.finalidade || "") + " | Status: " +
      (p.status || "");

    const description = document.createElement("p");
    description.textContent = p.descricao || "";

    card.append(title, details, info, description);

    const photos = normalizePhotos(p.fotos);
    const main = p.foto_principal;

    const displayPhotos = uniquePhotos([
      ...(main ? [main] : []),
      ...photos
    ]);

    displayPhotos.forEach(url => {
      const img = document.createElement("img");
      img.src = url;
      img.alt = p.titulo || "Foto do imóvel";
      img.onerror = () => img.remove();
      card.appendChild(img);
    });

    const edit = document.createElement("button");
    edit.className = "gold";
    edit.textContent = "Editar";
    edit.addEventListener("click", () => editProperty(p));

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = "Excluir";
    remove.addEventListener("click", () => deleteProperty(p));

    card.append(edit, remove);
    $("propertyList").appendChild(card);
  });
}


// ========================================
// EDITAR IMÓVEL
// ========================================

function editProperty(p) {
  $("propertyId").value = p.id;

  $("titulo").value = p.titulo || "";
  $("tipo").value = p.tipo || "Casa";
  $("finalidade").value = p.finalidade || "Venda";
  $("cidade").value = p.cidade || "";
  $("bairro").value = p.bairro || "";
  $("preco").value = p.preco ?? "";
  $("descricao").value = p.descricao || "";
  $("quartos").value = p.quartos ?? 0;
  $("banheiros").value = p.banheiros ?? 0;
  $("vagas").value = p.vagas ?? 0;
  $("area").value = p.area ?? "";

  currentPhotos = normalizePhotos(p.fotos);

  if (p.foto_principal && !currentPhotos.includes(p.foto_principal)) {
    currentPhotos.unshift(p.foto_principal);
  }

  selectedMain = p.foto_principal
    ? "old:" + currentPhotos.indexOf(p.foto_principal)
    : (currentPhotos.length ? "old:0" : null);

  $("fotos").value = "";

  $("status").value = p.status || "Disponível";

  $("formTitle").textContent = "Editar imóvel";
  $("saveBtn").textContent = "Salvar alterações";
  $("cancelBtn").classList.remove("hidden");

  renderPhotoPreview();
  hideMessage("formMessage");

  window.scrollTo({ top: 0, behavior: "smooth" });
}


// ========================================
// EXCLUIR IMÓVEL
// ========================================

async function deleteProperty(p) {
  const confirmar = confirm(
    "Tem certeza que deseja excluir este imóvel e suas fotografias?"
  );

  if (!confirmar) return;

  const { error } = await db
    .from("imoveis")
    .delete()
    .eq("id", p.id);

  if (error) {
    alert("Erro ao excluir imóvel: " + error.message);
    return;
  }

  const photos = uniquePhotos([
    p.foto_principal,
    ...normalizePhotos(p.fotos)
  ]);

  let message = "Imóvel excluído com sucesso!";

  try {
    await removePhotos(photos);
  } catch (errorFoto) {
    console.error(errorFoto);
    message += "\nNão foi possível excluir algumas fotos do armazenamento.";
  }

  alert(message);
  await loadProperties();
}


// ========================================
// LIMPAR FORMULÁRIO
// ========================================

function resetForm() {
  clearTemporaryUrls();

  $("propertyForm").reset();
  $("propertyId").value = "";

  currentPhotos = [];
  selectedMain = null;

  $("photoPreview").replaceChildren();

  $("formTitle").textContent = "Cadastrar novo imóvel";
  $("saveBtn").textContent = "Cadastrar imóvel";
  $("cancelBtn").classList.add("hidden");
}

$("cancelBtn").addEventListener("click", () => {
  resetForm();
  hideMessage("formMessage");
});


// ========================================
// SESSÃO
// ========================================

db.auth.onAuthStateChange(event => {
  if (event === "SIGNED_OUT") {
    showLogin();
  }
});


// ========================================
// INICIAR
// ========================================

checkSession();

</script>

</body>
</html>
